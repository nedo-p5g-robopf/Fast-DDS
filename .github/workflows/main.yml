name: ROS2 CI and Fortify SAST Scan

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build, test'
        required: true
        default: 'main'
        type: string

jobs:
  ros-ci-and-sast:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}

      # 0. 環境準備
      - name: ROS2 Colcon Build Dependencies Setup
        shell: bash
        run: |
          source /opt/ros/$ROS_DISTRO/setup.bash
          
          sudo apt-get update
          rosdep update
          rosdep install --from-paths . -y --ignore-src
          
      - name: Build and install gtest
        shell: bash
        run: |
          cd /usr/src/googletest
          sudo cmake CMakeLists.txt
          sudo make -j4
          sudo make install
          cd -
          
      - name: Initialize build result
        shell: bash
        run: |
          rm -rf build install log result
          mkdir result

      - name: Build the package
        shell: bash
        run: |
          source /opt/ros/$ROS_DISTRO/setup.bash
          colcon build --symlink-install --cmake-args -DEPROSIMA_BUILD_TESTS=ON -DFASTDDS_PIM_API_TESTS=OFF -DFASTRTPS_API_TESTS=OFF -DGTEST_INDIVIDUAL=ON -DPERFORMANCE_TESTS=OFF -DPROFILING_TESTS=OFF -DCOMPILE_TOOLS=ON -DSYSTEM_TESTS=OFF -DBUILD_SHARED_LIBS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo 2>&1 | tee result/ros2_build.log  
      
      - name: Test the package
        continue-on-error: true
        shell: bash
        run: |
          source /opt/ros/$ROS_DISTRO/setup.bash
          df -h /dev/shm
          rm -f /dev/shm/fastrtps*
          df -h /dev/shm
          colcon test --ctest-args --repeat until-pass:1 --timeout 60 --label-exclude xfail 2>&1 > result/ros2_test.log
          colcon test-result --all --verbose 2>&1 > result/ros2_test_result.log

      # 2. Fortifyによるビルドキャプチャ
      - name: ROS2 Colcon Build with Fortify Capture
        shell: bash
        run: |
          source /opt/ros/$ROS_DISTRO/setup.bash
          
          sourceanalyzer -b ros_core -clean
          sourceanalyzer -b ros_core -python-version 3 -python-path $PYTHONPATH $(find . -name "*.py")
          sourceanalyzer -b ros_core -exclude "/opt/**/*" -exclude "/usr/**/*" build/compile_commands.json --cmake-args \
            -DBUILD_SHARED_LIBS=ON \
            -DEPROSIMA_BUILD=OFF \
            -DEPROSIMA_INSTALLER=OFF \
            -DSTRICT_REALTIME=OFF \
            -DSQLITE3_SUPPORT=ON \
            -DAPPEND_PROJECT_NAME_TO_INCLUDEDIR=OFF \
            -DSECURITY=OFF \
            -DNO_TLS=OFF \
            -DSHM_TRANSPORT_DEFAULT=ON \
            -DFASTDDS_STATISTICS=ON \
            -DINTERNAL_DEBUG=OFF \
            -DLOG_CONSUMER_DEFAULT=AUTO \
            -DLOG_NO_INFO=ON \
            -DFASTDDS_ENFORCE_LOG_INFO=OFF \
            -DLOG_NO_WARNING=OFF \
            -DLOG_NO_ERROR=OFF \
            -DTHIRDPARTY=OFF \
            -DTHIRDPARTY_UPDATE=ON \
            -DTHIRDPARTY_fastcdr=OFF \
            -DTHIRDPARTY_Asio=OFF \
            -DTHIRDPARTY_TinyXML2=OFF \
            -DCOMPILE_EXAMPLES=OFF \
            -DINSTALL_EXAMPLES=OFF \
            -DEPROSIMA_BUILD_TESTS=OFF
          sourceanalyzer -b ros_core -scan -Xmx12G -D com.fortify.sca.rules.IsLibrary=true -sc classic -f result/fortify.fpr
          
          FPRUtility -information -listIssuesWithMetadata -project result/fortify.fpr -f result/fortify_result.csv -outputFormat CSV

      # 3. 生成された結果を保存
      - name: Upload Fortify Results
        uses: actions/upload-artifact@v7
        with:
          name: fortify-results
          path: result/
